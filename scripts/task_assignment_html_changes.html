<!-- 
  CHANGE #1: Add event listener to task project dropdown
  ========================================================
  Location: Around line 2684-2687 (Task Project select)
  
  AFTER the <select id="taskProject"> closing </select>, 
  add this onchange handler:
-->

<div class="form-group">
  <label>Project *</label>
  <select id="taskProject" required 
          onchange="handleTaskProjectChange(this.value)">
    <option value="">Select a project</option>
  </select>
</div>

<!-- Add this JavaScript function in the main script section -->
<script>
function handleTaskProjectChange(projectId) {
  if (projectId) {
    // Load eligible assignees when project is selected
    populateTaskAssigneeDropdown(parseInt(projectId));
  }
}
</script>
