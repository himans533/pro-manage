<!-- USER HIERARCHY VISUALIZATION MODAL & BUTTON -->
<!-- Location: Insert button in action-buttons div (line 1929 in admin-dashboard.html) -->
<!-- Location: Insert modal before </body> tag (line ~5500) -->

<!-- BUTTON TO ADD TO action-buttons (around line 1929) -->
<!-- Insert this as a new action-card -->
<div class="action-card">
    <h3><i class="fas fa-sitemap"></i> User Hierarchy</h3>
    <p>View organizational structure and team relationships</p>
    <button class="btn btn-primary" onclick="openHierarchyModal()">View Hierarchy</button>
</div>


<!-- MODAL TO ADD BEFORE </body> -->
<!-- User Hierarchy Modal -->
<div id="hierarchyModal" class="hierarchy-modal">
    <div class="hierarchy-modal-content">
        <div class="hierarchy-modal-header">
            <h2><i class="fas fa-sitemap"></i> User Hierarchy</h2>
            <button class="hierarchy-close-btn" onclick="closeHierarchyModal()">
                <i class="fas fa-times"></i>
            </button>
        </div>

        <div class="hierarchy-modal-body">
            <div class="hierarchy-controls">
                <button class="hierarchy-btn-expand" onclick="expandAllNodes()">
                    <i class="fas fa-expand-alt"></i> Expand All
                </button>
                <button class="hierarchy-btn-collapse" onclick="collapseAllNodes()">
                    <i class="fas fa-compress-alt"></i> Collapse All
                </button>
                <div class="hierarchy-search">
                    <input type="text" id="hierarchySearch" placeholder="Search by name or email..."
                        onkeyup="filterHierarchyTree()">
                    <i class="fas fa-search"></i>
                </div>
            </div>

            <div class="hierarchy-loading" id="hierarchyLoading">
                <div class="spinner"></div>
                <p>Loading organizational hierarchy...</p>
            </div>

            <div class="hierarchy-tree-container" id="hierarchyTreeContainer" style="display: none;">
                <div id="hierarchyTree" class="hierarchy-tree">
                    <!-- Tree will be populated here by JavaScript -->
                </div>
            </div>

            <div class="hierarchy-error" id="hierarchyError" style="display: none;">
                <i class="fas fa-exclamation-circle"></i>
                <p id="hierarchyErrorMsg">Failed to load hierarchy</p>
            </div>
        </div>
    </div>
</div>


<!-- STYLES FOR HIERARCHY MODAL & TREE -->
<style>

        top: 0;
        left: 0;
        right: 0;
        bottom: 0;

        z-index: 9999;
        overflow-y: auto;
    }

    .hierarchy-modal.active {
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .hierarchy-modal-content {
        background: var(--bg);
        border-radius: 12px;
        width: 90%;
        max-width: 900px;
        max-height: 90vh;
        display: flex;
        flex-direction: column;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .hierarchy-modal-header {
        padding: 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);

        border-radius: 12px 12px 0 0;
    }

    .hierarchy-modal-header h2 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
    }

    .hierarchy-close-btn {
        background: rgba(255, 255, 255, 0.2);
        border: none;
        color: white;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;

    .hierarchy-close-btn:hover {

        transform: rotate(90deg);

    .hierarchy-modal-body {
        padding: 24px;
        overflow-y: auto;

    .hierarchy-search input {

</style>


<!-- JAVASCRIPT FOR HIERARCHY MODAL & TREE -->
<script>
    // Open/Close Modal
    function openHierarchyModal() {
        document.getElementById('hierarchyModal').classList.add('active');
        loadHierarchyTree();
    }

    function closeHierarchyModal() {
        document.getElementById('hierarchyModal').classList.remove('active');
    }

    // Close on outside click
    document.getElementById('hierarchyModal')?.addEventListener('click', function(e) {
        if (e.target === this) closeHierarchyModal();
    });

    // Load and render hierarchy tree
    async function loadHierarchyTree() {
        const loading = document.getElementById('hierarchyLoading');
        const error = document.getElementById('hierarchyError');
        const container = document.getElementById('hierarchyTreeContainer');
        const tree = document.getElementById('hierarchyTree');

        try {
            loading.style.display = 'flex';
            error.style.display = 'none';
            container.style.display = 'none';

            const response = await fetch('/api/hierarchy/tree');
            if (!response.ok) throw new Error('Failed to load hierarchy');

            const data = await response.json();
            tree.innerHTML = renderHierarchyNodes(data.structure);

            loading.style.display = 'none';
            container.style.display = 'block';

            // Setup node click handlers
            document.querySelectorAll('.hierarchy-toggle').forEach(toggle => {
                toggle.addEventListener('click', function(e) {
                    e.stopPropagation();
                    toggleNode(this);
                });
            });

        } catch (err) {
            console.error('Hierarchy load error:', err);
            loading.style.display = 'none';
            error.style.display = 'flex';
            document.getElementById('hierarchyErrorMsg').textContent = err.message;
        }
    }

    // Render nodes recursively
    function renderHierarchyNodes(nodes, depth = 0) {
        return nodes.map(node => {
            const hasChildren = node.children && node.children.length > 0;
            const icon = getNodeIcon(node.type);
            const childrenHtml = hasChildren
                ? `<div class="hierarchy-node-children expanded">${renderHierarchyNodes(node.children, depth + 1)}</div>`
                : '';

            return `
                <div class="hierarchy-node hierarchy-node-${node.type}">
                    <div class="hierarchy-node-label">
                        <div class="hierarchy-toggle ${hasChildren ? '' : 'no-children'} ${hasChildren ? 'expanded' : ''}">
                            <i class="fas fa-chevron-right"></i>
                        </div>
                        <div class="hierarchy-node-icon">${icon}</div>
                        <div class="hierarchy-node-text">
                            <span class="hierarchy-node-name">${node.name}</span>
                        </div>
                    </div>
                    ${childrenHtml}
                </div>
            `;
        }).join('');
    }

    // Get icon for node type
    function getNodeIcon(type) {
        const icons = {
            'super_admin': '<i class="fas fa-crown"></i>',
            'coordinator': '<i class="fas fa-user-tie"></i>',
            'team_member': '<i class="fas fa-user"></i>',
            'project': '<i class="fas fa-folder"></i>',
            'milestone': '<i class="fas fa-flag"></i>',
            'task': '<i class="fas fa-tasks"></i>'
        };
        return icons[type] || '<i class="fas fa-circle"></i>';
    }

    // Toggle node expansion
    function toggleNode(toggleBtn) {
        const node = toggleBtn.closest('.hierarchy-node');
        const children = node.querySelector('.hierarchy-node-children');

        if (children) {
            children.classList.toggle('expanded');
            toggleBtn.classList.toggle('expanded');
        }
    }

    // Expand all nodes
    function expandAllNodes() {
        document.querySelectorAll('.hierarchy-toggle').forEach(toggle => {
            const node = toggle.closest('.hierarchy-node');
            const children = node.querySelector('.hierarchy-node-children');
            if (children) {
                children.classList.add('expanded');
                toggle.classList.add('expanded');
            }
        });
    }

    // Collapse all nodes
    function collapseAllNodes() {
        document.querySelectorAll('.hierarchy-toggle').forEach(toggle => {
            const node = toggle.closest('.hierarchy-node');
            const children = node.querySelector('.hierarchy-node-children');
            if (children) {
                children.classList.remove('expanded');
                toggle.classList.remove('expanded');
            }
        });
    }

    // Search filter
    function filterHierarchyTree() {
        const searchTerm = document.getElementById('hierarchySearch').value.toLowerCase();
        const allNodes = document.querySelectorAll('.hierarchy-node');

        if (!searchTerm) {
            allNodes.forEach(node => node.classList.remove('hidden'));
            return;
        }

        allNodes.forEach(node => {
            const text = node.textContent.toLowerCase();
            const matches = text.includes(searchTerm);
            node.classList.toggle('hidden', !matches);

            if (matches) {
                // Expand parents when child matches
                let parent = node.closest('.hierarchy-node-children')?.closest('.hierarchy-node');
                while (parent) {
                    parent.classList.remove('hidden');
                    const toggle = parent.querySelector('.hierarchy-toggle');
                    if (toggle && !toggle.classList.contains('no-children')) {
                        toggle.classList.add('expanded');
                        const children = parent.querySelector('.hierarchy-node-children');
                        if (children) children.classList.add('expanded');
                    }
                    parent = parent.closest('.hierarchy-node-children')?.closest('.hierarchy-node');
                }
            }
        });
    }

    // Close modal on Escape key
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') closeHierarchyModal();
    });
</script>
